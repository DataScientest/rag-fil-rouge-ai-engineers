[project]
name = "rag-fil-rouge"
version = "1.0.0"
description = "RAG fil rouge (Service-Public, congés du secteur privé) — projet AI Engineers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4",
    "langchain-core>=1.6.5",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.6",
    "langchain-qdrant>=1.1",
    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.2",
    "mcp>=1.27,<2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "notebook>=7.4",
    "pytest>=9.1.1",
]
