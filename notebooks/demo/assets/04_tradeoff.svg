<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A33"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF6745"/></marker></defs><rect width="1200" height="400" fill="#FFFFFF"/><text x="40" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#1A1A33" font-weight="bold" text-anchor="start">Choisir un modèle, c&#x27;est arbitrer</text><text x="40" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#8A8A99" font-weight="normal" text-anchor="start">Trois critères, qui tirent dans des sens opposés</text><rect x="40" y="115" width="355" height="250" rx="12" fill="#FF6745" stroke="none" stroke-width="2"/><text x="217" y="165" font-family="Liberation Sans, Arial, sans-serif" font-size="30" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Qualité</text><text x="217" y="205" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="normal" text-anchor="middle">s&#x27;améliore avec :</text><text x="217" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">• gros modèle</text><text x="217" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">• raisonnement</text><text x="217" y="318" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">• bon contexte</text><rect x="425" y="115" width="355" height="250" rx="12" fill="#E8E7E1" stroke="none" stroke-width="2"/><text x="602" y="165" font-family="Liberation Sans, Arial, sans-serif" font-size="30" fill="#1A1A33" font-weight="bold" text-anchor="middle">Latence</text><text x="602" y="205" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="middle">s&#x27;améliore avec :</text><text x="602" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#1A1A33" font-weight="bold" text-anchor="middle">• petit modèle</text><text x="602" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#1A1A33" font-weight="bold" text-anchor="middle">• réponse courte</text><text x="602" y="318" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#1A1A33" font-weight="bold" text-anchor="middle">• streaming</text><rect x="810" y="115" width="355" height="250" rx="12" fill="#E8E7E1" stroke="none" stroke-width="2"/><text x="987" y="165" font-family="Liberation Sans, Arial, sans-serif" font-size="30" fill="#1A1A33" font-weight="bold" text-anchor="middle">Coût</text><text x="987" y="205" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="middle">s&#x27;améliore avec :</text><text x="987" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#1A1A33" font-weight="bold" text-anchor="middle">• petit modèle</text><text x="987" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#1A1A33" font-weight="bold" text-anchor="middle">• moins de tokens</text><text x="987" y="318" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#1A1A33" font-weight="bold" text-anchor="middle">• cache de prompt</text></svg>