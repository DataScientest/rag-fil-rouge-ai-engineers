<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A33"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF6745"/></marker></defs><rect width="1200" height="470" fill="#FFFFFF"/><text x="40" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#1A1A33" font-weight="bold" text-anchor="start">Ce qu&#x27;on envoie au modèle</text><text x="40" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#8A8A99" font-weight="normal" text-anchor="start">Une liste de messages, chacun avec un rôle, et un schéma pour la sortie</text><rect x="40" y="115" width="640" height="64" rx="12" fill="#1A1A33" stroke="none" stroke-width="2"/><text x="65" y="155" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="start">SystemMessage</text><text x="330" y="155" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#FFFFFF" font-weight="normal" text-anchor="start">rôle, ton, limites : une fois pour toutes</text><rect x="40" y="193" width="640" height="64" rx="12" fill="#E8E7E1" stroke="none" stroke-width="2"/><text x="65" y="233" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="20" fill="#1A1A33" font-weight="bold" text-anchor="start">HumanMessage</text><text x="330" y="233" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#1A1A33" font-weight="normal" text-anchor="start">exemple de question</text><rect x="40" y="271" width="640" height="64" rx="12" fill="#E8E7E1" stroke="none" stroke-width="2"/><text x="65" y="311" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="20" fill="#1A1A33" font-weight="bold" text-anchor="start">AIMessage</text><text x="330" y="311" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#1A1A33" font-weight="normal" text-anchor="start">réponse attendue à l&#x27;exemple</text><rect x="40" y="349" width="640" height="64" rx="12" fill="#FF6745" stroke="none" stroke-width="2"/><text x="65" y="389" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="start">HumanMessage</text><text x="330" y="389" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#FFFFFF" font-weight="normal" text-anchor="start">la vraie question</text><path d="M 690 194 L 705 194 L 705 335 L 690 335" fill="none" stroke="#FF6745" stroke-width="3"/><text x="715" y="270" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#FF6745" font-weight="bold" text-anchor="start">few-shot</text><line x1="820" y1="270" x2="880" y2="270" stroke="#1A1A33" stroke-width="2.5" marker-end="url(#a)"/><rect x="890" y="180" width="270" height="180" rx="12" fill="#1A1A33" stroke="none" stroke-width="2"/><text x="1025" y="232" font-family="Liberation Sans, Arial, sans-serif" font-size="24" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Modèle</text><text x="1025" y="272" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="normal" text-anchor="middle">+ schéma Pydantic</text><text x="1025" y="300" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#FF8B70" font-weight="bold" text-anchor="middle">with_structured_output</text><text x="1025" y="330" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="normal" text-anchor="middle">→ un objet typé</text><text x="40" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#8A8A99" font-weight="normal" text-anchor="start">Ce que le modèle ne sait pas (date, règles internes, documents), on le met dans les messages.</text></svg>