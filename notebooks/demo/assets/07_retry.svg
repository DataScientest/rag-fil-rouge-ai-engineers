x27;erreur remonte</text><text x="660" y="330" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#8A8A99" font-weight="normal" text-anchor="start">réessayer ne changerait rien</text><text x="40" y="395" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#8A8A99" font-weight="normal" text-anchor="start">Un seul étage de réessai : la bibliothèque, la gateway ou votre code. 3 étages × 3 essais = 27 appels.</text></svg>