<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A33"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF6745"/></marker></defs><rect width="1200" height="440" fill="#FFFFFF"/><text x="40" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#1A1A33" font-weight="bold" text-anchor="start">La boucle d&#x27;appel d&#x27;outils</text><text x="40" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#8A8A99" font-weight="normal" text-anchor="start">Le modèle demande, votre code exécute, le modèle répond</text><rect x="40" y="190" width="220" height="80" rx="12" fill="#E8E7E1" stroke="none" stroke-width="2"/><text x="150" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#1A1A33" font-weight="bold" text-anchor="middle">Question</text><line x1="262" y1="230" x2="330" y2="230" stroke="#1A1A33" stroke-width="2.5" marker-end="url(#a)"/><rect x="335" y="175" width="240" height="110" rx="12" fill="#1A1A33" stroke="none" stroke-width="2"/><text x="455" y="222" font-family="Liberation Sans, Arial, sans-serif" font-size="24" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Modèle</text><text x="455" y="255" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="normal" text-anchor="middle">+ outils déclarés</text><line x1="577" y1="230" x2="650" y2="230" stroke="#1A1A33" stroke-width="2.5" marker-end="url(#a)"/><rect x="655" y="175" width="200" height="110" rx="12" fill="#E8E7E1" stroke="none" stroke-width="2"/><text x="755" y="222" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="21" fill="#1A1A33" font-weight="bold" text-anchor="middle">tool_calls ?</text><line x1="857" y1="230" x2="935" y2="230" stroke="#FF6745" stroke-width="2.5" marker-end="url(#ao)"/><text x="895" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#FF6745" font-weight="bold" text-anchor="middle">non</text><rect x="940" y="190" width="220" height="80" rx="12" fill="#FF6745" stroke="none" stroke-width="2"/><text x="1050" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Réponse</text><path d="M 755 287 L 755 360 L 600 360" fill="none" stroke="#1A1A33" stroke-width="2.5" marker-end="url(#a)"/><text x="770" y="330" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#1A1A33" font-weight="bold" text-anchor="start">oui</text><rect x="340" y="325" width="255" height="75" rx="12" fill="#F4F3EF" stroke="none" stroke-width="2"/><text x="467" y="357" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#1A1A33" font-weight="bold" text-anchor="middle">votre code exécute</text><text x="467" y="383" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="middle">→ ToolMessage</text><path d="M 400 323 L 400 289" fill="none" stroke="#1A1A33" stroke-width="2.5" marker-end="url(#a)"/><text x="40" y="150" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#8A8A99" font-weight="normal" text-anchor="start">Chaque tour renvoie toute la conversation : les tokens d&#x27;entrée, et le coût, augmentent à chaque tour.</text></svg>