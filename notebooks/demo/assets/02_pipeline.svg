<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A33"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF6745"/></marker></defs><rect width="1200" height="330" fill="#FFFFFF"/><text x="40" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#1A1A33" font-weight="bold" text-anchor="start">Du texte à la réponse : ce que voit un Transformer</text><text x="40" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#8A8A99" font-weight="normal" text-anchor="start">Chaque étape est une section de la démo</text><rect x="40" y="120" width="196.0" height="170" rx="12" fill="#E8E7E1" stroke="none" stroke-width="2"/><text x="138.0" y="165" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#1A1A33" font-weight="bold" text-anchor="middle">Texte</text><text x="138.0" y="205" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="middle">« Le salarié</text><text x="138.0" y="231" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="middle">a posé ses congés »</text><line x1="238.0" y1="205" x2="269.0" y2="205" stroke="#1A1A33" stroke-width="2.5" marker-end="url(#a)"/><rect x="271.0" y="120" width="196.0" height="170" rx="12" fill="#E8E7E1" stroke="none" stroke-width="2"/><text x="369.0" y="165" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#1A1A33" font-weight="bold" text-anchor="middle">Tokens</text><text x="369.0" y="205" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="middle">[Le][ sal][ari][é]…</text><text x="369.0" y="231" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="middle">des morceaux de mots</text><line x1="469.0" y1="205" x2="500.0" y2="205" stroke="#1A1A33" stroke-width="2.5" marker-end="url(#a)"/><rect x="502.0" y="120" width="196.0" height="170" rx="12" fill="#E8E7E1" stroke="none" stroke-width="2"/><text x="600.0" y="165" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#1A1A33" font-weight="bold" text-anchor="middle">Numéros</text><text x="600.0" y="205" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="middle">[43, 82245, …]</text><text x="600.0" y="231" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="middle">un vocabulaire fixe</text><line x1="700.0" y1="205" x2="731.0" y2="205" stroke="#1A1A33" stroke-width="2.5" marker-end="url(#a)"/><rect x="733.0" y="120" width="196.0" height="170" rx="12" fill="#E8E7E1" stroke="none" stroke-width="2"/><text x="831.0" y="165" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#1A1A33" font-weight="bold" text-anchor="middle">Vecteurs</text><text x="831.0" y="205" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="middle">1 536 nombres</text><text x="831.0" y="231" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="middle">le sens du texte</text><line x1="931.0" y1="205" x2="962.0" y2="205" stroke="#1A1A33" stroke-width="2.5" marker-end="url(#a)"/><rect x="964.0" y="120" width="196.0" height="170" rx="12" fill="#FF6745" stroke="none" stroke-width="2"/><text x="1062.0" y="165" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Attention</text><text x="1062.0" y="205" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="normal" text-anchor="middle">chaque token</text><text x="1062.0" y="231" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="normal" text-anchor="middle">regarde les autres</text></svg>