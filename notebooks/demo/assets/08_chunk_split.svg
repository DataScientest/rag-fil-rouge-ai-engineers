<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A33"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF6745"/></marker></defs><rect width="1200" height="470" fill="#FFFFFF"/><text x="40" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#1A1A33" font-weight="bold" text-anchor="start">Pourquoi la recherche rate : le découpage</text><text x="40" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#8A8A99" font-weight="normal" text-anchor="start">F151, section « Quelle est la durée du congé pour enfant malade ? », coupée en deux chunks</text><rect x="40" y="115" width="540" height="300" rx="12" fill="#E8E7E1" stroke="none" stroke-width="2"/><text x="65" y="150" font-family="Liberation Sans, Arial, sans-serif" font-size="20" fill="#1A1A33" font-weight="bold" text-anchor="start">Chunk A — rang 1</text><text x="65" y="190" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="start">## Quelle est la durée du congé</text><text x="65" y="214" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="start">   du salarié pour enfant malade ?</text><text x="65" y="238" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="start">### L&#x27;enfant a moins d&#x27;1 an</text><text x="65" y="262" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="start">→ 5 jours par an</text><text x="65" y="286" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="start">### Au moins 3 enfants à charge</text><text x="65" y="310" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="start">→ 5 jours par an</text><text x="65" y="395" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#1A1A33" font-weight="bold" text-anchor="start">beaucoup de mots de la question</text><rect x="620" y="115" width="540" height="300" rx="12" fill="#FFFFFF" stroke="#FF6745" stroke-width="3"/><text x="645" y="150" font-family="Liberation Sans, Arial, sans-serif" font-size="20" fill="#FF6745" font-weight="bold" text-anchor="start">Chunk B — rang 5</text><text x="645" y="190" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="start">### Autre cas</text><text x="645" y="214" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="start"></text><text x="645" y="238" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="start">La durée maximale du congé</text><text x="645" y="262" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="start">pour enfant malade est fixée</text><text x="645" y="286" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#1A1A33" font-weight="normal" text-anchor="start">à 3 jours par an.</text><text x="645" y="395" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#FF6745" font-weight="bold" text-anchor="start">la règle générale, sans le titre</text><text x="40" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#8A8A99" font-weight="normal" text-anchor="start">Le modèle ne reçoit que les 3 premiers chunks : il voit « 5 jours » et le présente comme la règle.</text></svg>